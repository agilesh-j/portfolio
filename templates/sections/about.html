<section id="about">
  <h2>About me</h2>
  <div class="about">
    <div class="card">
      {% for paragraph in d.ABOUT %}<p>{{ paragraph }}</p>{% endfor %}
    </div>
    <div class="card looking">
      <h3>Looking for</h3>
      <ul>{% for r in d.LOOKING_FOR %}<li>{{ r }}</li>{% endfor %}</ul>
      <a class="btn main" href="#contact">Get in touch</a>
    </div>
  </div>
</section>
